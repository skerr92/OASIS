name: jump_basic
profile: oasis-base16-v0.1-draft
description: Conditional and unconditional jump behavior.
program:
  - MVI r1, 5
  - MVI r2, 5
  - JEQ r1, r2, equal
  - MVI r3, 0xffff
  - "equal:"
  - MVI r3, 0x0001
  - JMP done
  - MVI r3, 0x0002
  - "done:"
  - NOP
expect:
  registers:
    r3: 0x0001
