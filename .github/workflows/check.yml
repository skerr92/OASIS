name: Check

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"

env:
  GCC_VERSION: "14.3.0"
  BINUTILS_VERSION: "2.46"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: make check

  toolchain-artifacts:
    name: Build Toolchain Artifacts
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            bison \
            curl \
            flex \
            libgmp-dev \
            libisl-dev \
            libmpc-dev \
            libmpfr-dev \
            texinfo \
            xz-utils

      - name: Download upstream toolchain sources
        run: |
          mkdir -p .build/sources .build/artifacts
          curl -L "https://ftp.gnu.org/gnu/gcc/gcc-${GCC_VERSION}/gcc-${GCC_VERSION}.tar.xz" \
            -o ".build/sources/gcc-${GCC_VERSION}.tar.xz"
          curl -L "https://ftp.gnu.org/gnu/binutils/binutils-${BINUTILS_VERSION}.tar.xz" \
            -o ".build/sources/binutils-${BINUTILS_VERSION}.tar.xz"
          tar -C .build/sources -xf ".build/sources/gcc-${GCC_VERSION}.tar.xz"
          tar -C .build/sources -xf ".build/sources/binutils-${BINUTILS_VERSION}.tar.xz"

      - name: Build and validate OASIS toolchain
        run: |
          toolchain/scripts/build-linux-gcc14.sh \
            --prefix "$PWD/.toolchain/oasis16" \
            --gcc-src "$PWD/.build/sources/gcc-${GCC_VERSION}" \
            --binutils-src "$PWD/.build/sources/binutils-${BINUTILS_VERSION}" \
            --jobs 2 \
            --clean \
            --force \
            --run-tests

      - name: Generate source metadata
        run: make generate

      - name: Package artifacts
        run: |
          toolchain/scripts/package-toolchain-installer.sh \
            --prefix "$PWD/.toolchain/oasis16" \
            --name "oasis16-toolchain-${GITHUB_SHA}" \
            --output "$PWD/.build/artifacts/oasis16-toolchain-${GITHUB_SHA}.tar.gz"
          toolchain/scripts/package-source-release.sh \
            --name "oasis-source-${GITHUB_SHA}" \
            --output "$PWD/.build/artifacts/oasis-source-${GITHUB_SHA}.tar.gz"

      - name: Upload toolchain installer
        uses: actions/upload-artifact@v4
        with:
          name: oasis16-toolchain-installer
          path: .build/artifacts/oasis16-toolchain-*.tar.gz

      - name: Upload source and compliance package
        uses: actions/upload-artifact@v4
        with:
          name: oasis-source-compliance-package
          path: .build/artifacts/oasis-source-*.tar.gz
